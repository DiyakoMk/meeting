<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#b91c4a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#b91c4a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#b91c4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#b91c4a"/>
      <stop offset="100%" stop-color="#1a0610"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%"  stop-color="#15040a"/>
      <stop offset="100%" stop-color="#020103"/>
    </radialGradient>
  </defs>

  <!-- Page bg -->
  <rect width="1024" height="1024" fill="url(#bg)" rx="180"/>

  <!-- Outer halo -->
  <circle cx="512" cy="512" r="430" fill="url(#halo)"/>

  <!-- Atmosphere ring -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#b91c4a" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="512" cy="512" r="360" fill="none" stroke="#be123c" stroke-opacity="0.10" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- Sphere body -->
  <circle cx="512" cy="512" r="280" fill="url(#sphere)"/>

  <!-- Specular highlight -->
  <ellipse cx="430" cy="420" rx="80" ry="50" fill="#ffffff" fill-opacity="0.22"/>
</svg>
