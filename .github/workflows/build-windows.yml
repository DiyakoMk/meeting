name: Build Windows desktop

# Runs on demand via the Actions tab (workflow_dispatch) so we never
# accidentally publish a build from a normal push. The job also runs on
# pushes that touch the electron/ wrapper or the bundled assets, so a
# late tweak to main.js automatically rebuilds the installer.
on:
  workflow_dispatch:
  push:
    branches: [orblood, orblood2]
    paths:
      - 'electron/**'
      - 'public/**'
      - 'server/**'
      - 'package.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Top-level package installs Electron + electron-builder. The
      # postinstall script then runs `cd server && npm install --omit=dev`
      # so the embedded backend has its node_modules ready before
      # electron-builder packs everything into asar.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run build:win
        env:
          # electron-builder publishes nothing by default, but we still
          # set GH_TOKEN to silence the "skipping publish" warning when
          # this runs from a workflow_dispatch.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: orblood-windows
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30
